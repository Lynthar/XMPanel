name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xmpanel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by audit_pg_test.go; when unset those tests skip instead of running.
      XMPANEL_TEST_DSN: postgres://postgres:test@127.0.0.1:5432/xmpanel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -v ./... | tee test.log

      - name: No test may skip
        run: '! grep -- "--- SKIP" test.log'

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v4

      # Exposes the runtime token the gha cache backend needs.
      - uses: crazy-max/ghaction-github-runtime@v4

      # The server images are built from apt on purpose (no Docker Hub pull);
      # the layer cache turns a repeat build into seconds. Bake resolves the
      # compose file's build contexts from its own cwd, hence source: ./smoke.
      - name: Build server images
        uses: docker/bake-action@v7
        with:
          source: ./smoke
          files: docker-compose.yml
          load: true
          set: |
            prosody.cache-from=type=gha,scope=smoke-prosody
            prosody.cache-to=type=gha,scope=smoke-prosody,mode=max
            ejabberd.cache-from=type=gha,scope=smoke-ejabberd
            ejabberd.cache-to=type=gha,scope=smoke-ejabberd,mode=max
            synapse.cache-from=type=gha,scope=smoke-synapse
            synapse.cache-to=type=gha,scope=smoke-synapse,mode=max
            synapse-mas.cache-from=type=gha,scope=smoke-synapse
            synapse-mas.cache-to=type=gha,scope=smoke-synapse,mode=max
            mas.cache-from=type=gha,scope=smoke-mas
            mas.cache-to=type=gha,scope=smoke-mas,mode=max
            tuwunel.cache-from=type=gha,scope=smoke-tuwunel
            tuwunel.cache-to=type=gha,scope=smoke-tuwunel,mode=max
            continuwuity.cache-from=type=gha,scope=smoke-continuwuity
            continuwuity.cache-to=type=gha,scope=smoke-continuwuity,mode=max

      # The test starts smoke/docker-compose.yml itself (real Prosody 13,
      # ejabberd, Synapse, Tuwunel, Continuwuity and Synapse + MAS); the
      # containers are kept so the log step can read them, the runner is
      # discarded anyway.
      - name: Smoke against real servers
        env:
          XMPANEL_SMOKE_KEEP: "1"
          XMPANEL_SMOKE_PREBUILT: "1"
        run: go test -v -count=1 -tags smoke ./smoke/...

      - name: Server logs on failure
        if: failure()
        run: docker compose -f smoke/docker-compose.yml logs
