# Real servers for `make smoke`. Nothing here is a deployment artefact: the
# accounts, tokens and ports exist only for the test run.
services:
  prosody:
    image: smoke-prosody
    build: ./prosody
    ports:
      - "127.0.0.1:15222:5222"
      - "127.0.0.1:15280:5280"
    volumes:
      - ../prosody/mod_admin_panel.lua:/etc/prosody/modules/mod_admin_panel.lua:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/prosody/admin-token.txt"]
      interval: 2s
      timeout: 2s
      retries: 30

  ejabberd:
    image: smoke-ejabberd
    build: ./ejabberd
    ports:
      - "127.0.0.1:15223:5222"
      - "127.0.0.1:15281:5280"
    healthcheck:
      test: ["CMD-SHELL", "runuser -u ejabberd -- ejabberdctl check_account admin example.com"]
      interval: 3s
      timeout: 5s
      retries: 60

  synapse:
    image: smoke-synapse
    build: ./synapse
    ports:
      - "127.0.0.1:18008:8008"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/matrix-synapse/admin-token.txt"]
      interval: 3s
      timeout: 3s
      retries: 60

  tuwunel:
    image: smoke-tuwunel
    build: ./tuwunel
    ports:
      - "127.0.0.1:18010:8008"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tuwunel/admin-token.txt"]
      interval: 3s
      timeout: 3s
      retries: 60

  continuwuity:
    image: smoke-continuwuity
    build: ./continuwuity
    ports:
      - "127.0.0.1:18011:8008"
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/continuwuity/admin-token.txt"]
      interval: 3s
      timeout: 3s
      retries: 60

  # A second Synapse that delegates authentication to MAS, which needs
  # PostgreSQL; the admin token for this pair comes from the mas container.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  mas:
    image: smoke-mas
    build: ./mas
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/mas/admin-token.txt"]
      interval: 3s
      timeout: 3s
      retries: 60

  synapse-mas:
    image: smoke-synapse-mas
    build: ./synapse
    ports:
      - "127.0.0.1:18009:8008"
    environment:
      SMOKE_AUTH: mas
    volumes:
      - ./synapse/mas.yaml:/etc/matrix-synapse/conf.d/zz-mas.yaml:ro
    # Started, not healthy: MAS's admin registration needs this Synapse up.
    depends_on:
      mas:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/_matrix/client/versions"]
      interval: 3s
      timeout: 3s
      retries: 60
